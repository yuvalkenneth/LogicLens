[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logiclens"
version = "0.0.0"
description = "Evidence-backed repository mapping and codebase understanding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "networkx>=3.4",
  "pydantic>=2.11",
  "tree-sitter>=0.25",
]

[project.scripts]
logiclens = "logiclens.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/logiclens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
